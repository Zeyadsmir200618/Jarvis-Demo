# J.A.R.V.I.S. local development stack.
#   docker compose up --build        start (frontend http://localhost:3000, API http://localhost:8000/docs)
#   docker compose ps / logs -f      inspect
#   docker compose down              stop
# Ports bind to 127.0.0.1 only, so nothing is exposed to your LAN.
# Ollama and the MCP server run on the HOST (GPU access / host files); see docs/.
name: jarvis

services:
  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      MCP_TRANSPORT: http
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      WATCHFILES_FORCE_POLLING: "true"   # reliable hot reload on Windows/macOS bind mounts
      JARVIS_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - jarvis-data:/app/data             # audit log + generated files (not in Git)
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach Ollama/MCP on the host (needed on Linux)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000   # used by YOUR browser, so it stays localhost
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules                   # keep the container's node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  jarvis-data:
